<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Total Serialism Pen Plotter</title>
  <meta http-equiv="refresh" content="0; url=pen-plotter/index.html">
  <script>
    (function() {
      const pathname = window.location.pathname;
      const basePath = pathname.endsWith('/index.html')
        ? pathname.slice(0, -'index.html'.length)
        : pathname;
      const normalizedBase = basePath.endsWith('/') ? basePath : `${basePath}/`;
      const target = `${window.location.origin}${normalizedBase}pen-plotter/index.html${window.location.search}${window.location.hash}`;
      window.location.replace(target);
    })();
  </script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #0f1115;
      color: #e8ecf1;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .card {
      max-width: 36rem;
      padding: 1.5rem;
      border: 1px solid #2a3240;
      border-radius: 12px;
      background: #171b22;
      text-align: center;
    }
    a {
      color: #55d2b8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Total Serialism</h1>
    <p>Redirecting to the current Pen Plotter gallery...</p>
    <p><a href="pen-plotter/index.html">Open it now</a></p>
  </div>
</body>
</html>
